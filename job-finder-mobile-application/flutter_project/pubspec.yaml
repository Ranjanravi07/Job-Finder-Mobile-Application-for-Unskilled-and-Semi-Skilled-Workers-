name: job_finder_app
description: "Job Finder Mobile Application for Unskilled and Semi-Skilled Workers in Nepal. Made with Flutter."
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Helper packages
  google_fonts: ^8.2.1
  url_launcher: ^6.1.11 # For phone calls and WhatsApp opening
  intl: ^0.20.2

  # Local persistence, voice input and image picking
  shared_preferences: ^2.2.2
  flutter_tts: ^4.2.5
  image_picker: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  provider: ^6.1.5+1
  cloud_firestore: ^6.8.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  firebase_storage: ^13.4.6
  pinput: ^6.0.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
  - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.jpg"
  min_sdk_android: 24
