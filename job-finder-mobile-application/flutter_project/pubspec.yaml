name: job_finder_app
description: "Job Finder Mobile Application for Unskilled and Semi-Skilled Workers in Nepal. Made with Flutter."
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Helper packages
  google_fonts: ^8.2.1
  url_launcher: ^6.1.11 # For phone calls and WhatsApp opening
  intl: ^0.20.2

  # Local persistence, voice input and image picking
  shared_preferences: ^2.2.2
  flutter_tts: ^4.2.5
  image_picker: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true
